name: 'OMÉGA-R — relevé des exécutions GitHub'
# Vérifie seulement l'état des jobs précédents. Ne lance aucune compression.
on:
  push:
    paths:
      - '.github/workflows/omr-status-snapshot.yml'

permissions:
  actions: read
  contents: write

jobs:
  report:
    if: ${{ contains(github.event.head_commit.message, '[omr-status-once]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Lire les API GitHub Actions et publier un état condensé
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, datetime, json, os, urllib.error, urllib.parse, urllib.request
          repo=os.environ['GH_REPO']
          token=os.environ['GITHUB_TOKEN']
          headers={
            'Authorization':'Bearer '+token,
            'Accept':'application/vnd.github+json',
            'X-GitHub-Api-Version':'2022-11-28',
            'User-Agent':'hutter-omega-r-status-audit'
          }
          endpoint='https://api.github.com/repos/'+repo
          def request(path, data=None, method=None):
            req=urllib.request.Request(endpoint+path,headers=headers,
               data=(json.dumps(data).encode('utf-8') if data is not None else None),
               method=method)
            with urllib.request.urlopen(req,timeout=25) as res:
              return json.load(res)
          names=[
            'omr12-cmix-neif-canary.yml',
            'omr11-enwik9-full.yml',
            'omr11-enwik8-ablation.yml',
            'omr9-build-upstream.yml',
          ]
          result={
             'project':'Hutter OMEGA-R',
             'query_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
             'scope':'GitHub Actions metadata only: no corpus, no executables, no credentials',
             'competition_submission_sent':False,
             'workflows':{}
          }
          for name in names:
            runs=request('/actions/workflows/'+urllib.parse.quote(name)+'/runs?per_page=4')
            entries=[]
            for item in runs.get('workflow_runs',[])[:4]:
              rid=item['id']
              jobs=request('/actions/runs/'+str(rid)+'/jobs?per_page=30')
              artifacts=request('/actions/runs/'+str(rid)+'/artifacts?per_page=20')
              entries.append({
                'run_id':rid,
                'url':item['html_url'],
                'status':item['status'],
                'conclusion':item.get('conclusion'),
                'created_at':item.get('created_at'),
                'updated_at':item.get('updated_at'),
                'head_sha':item.get('head_sha'),
                'event':item.get('event'),
                'jobs':[{
                    'id':j['id'], 'name':j['name'], 'status':j['status'],
                    'conclusion':j.get('conclusion'),
                    'active_steps':[s['name'] for s in j.get('steps',[])
                       if s.get('status')=='in_progress'],
                    'failed_steps':[s['name'] for s in j.get('steps',[])
                       if s.get('conclusion')=='failure'],
                  } for j in jobs.get('jobs',[])],
                'artifacts':[{
                    'id':a['id'],'name':a['name'],
                    'size_in_bytes':a.get('size_in_bytes')
                  } for a in artifacts.get('artifacts',[])],
              })
            result['workflows'][name]=entries
          dest='/contents/Hutter_OmegaR/status/workflow_status_snapshot.json'
          try:
            old=request(dest)
            oldsha=old['sha']
          except urllib.error.HTTPError as e:
            if e.code!=404:
              raise
            oldsha=None
          body={
             'message':'Consigner les états GitHub Actions sans déclencher de calcul',
             'branch':'main',
             'content':base64.b64encode((json.dumps(result,indent=2,ensure_ascii=False)+chr(10)).encode()).decode()
          }
          if oldsha:
            body['sha']=oldsha
          uploaded=request(dest,body,'PUT')
          print('Snapshot published; jobs inspected:',sum(len(v) for v in result['workflows'].values()))
          print('Snapshot commit:',uploaded['commit']['sha'])
          PY
