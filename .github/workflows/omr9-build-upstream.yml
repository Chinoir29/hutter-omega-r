name: 'OMÉGA-R v0.9 — compilation d’une référence compétitive'

# Un seul build de référence; jamais de compression enwik9 ni de candidature.
on:
  push:
    paths:
      - '.github/workflows/omr9-build-upstream.yml'
  workflow_dispatch:

permissions:
  contents: write # Publier uniquement un petit fichier de diagnostic JSON, jamais de modèle ou corpus

concurrency:
  group: omr9-upstream-build
  cancel-in-progress: false

jobs:
  build_upstream:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[omr9-upstream-build-once]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Préparer les dépendances système standard
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential make binutils ca-certificates git gawk python3 \
            clang-18 lld-18 llvm-18 libclang-rt-18-dev gcc-13 g++-13 time
          for x in clang++-18 clang-18 ld.lld-18 llvm-profdata-18 \
                   llvm-strip-18 llvm-objcopy-18 gawk gcc python3 make; do
            command -v "$x"
          done

      - name: Récupérer et vérifier la révision publiée sous GPL-3.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          expected=35d1957a5074db802fc134126afc77b76d931761
          git init -q upstream
          git -C upstream remote add origin https://github.com/marwoelk/cmix-neif-2.0.git
          git -C upstream fetch --depth 1 origin "$expected"
          git -C upstream checkout --detach -q FETCH_HEAD
          cd upstream
          actual="$(git rev-parse HEAD)"
          printf '%s\n' "$actual" | tee ../reports/upstream_commit.txt
          test "$actual" = "$expected"
          test -s LICENSE
          sha256sum LICENSE build.sh install.sh > ../reports/upstream_scripts_sha256.txt
          printf 'Upstream license: GNU GPL-3.0; https://github.com/marwoelk/cmix-neif-2.0\n' > ../reports/provenance.txt
          { uname -a; clang++-18 --version | head -1; gcc --version | head -1; free -h; df -h .; } > ../reports/environment.txt

      - name: Compiler uniquement la référence, sans exécuter enwik9
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          /usr/bin/time -f 'wall_s=%e peak_rss_kib=%M' -o reports/build_resources.txt \
            bash -c 'cd work && bash ../upstream/build.sh' \
            > reports/build_stdout.log 2> reports/build_stderr.log || {
              echo 'ERROR: upstream build failed; diagnostics retained.'
              tail -100 reports/build_stderr.log || true
              tail -100 reports/build_stdout.log || true
              exit 1
            }
          test -s work/comp9
          stat -c '%s' work/comp9 > reports/comp9_bytes.txt
          sha256sum work/comp9 > reports/comp9_sha256.txt
          echo 'BUILD SUCCESS; not a Hutter Prize score.'
          cat reports/comp9_bytes.txt reports/comp9_sha256.txt

      - name: Archiver seulement les rapports, même en cas d'échec
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omr9-upstream-build-diagnostics
          path: reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Enregistrer le diagnostic dans le dépôt
        if: always()
        continue-on-error: true # Ne masque pas le statut de compilation si GitHub refuse l'écriture
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OMR9_JOB_STATUS: ${{ job.status }}
          OMR9_REPO: ${{ github.repository }}
          OMR9_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import base64, datetime, json, os, pathlib, urllib.error, urllib.request
          repo = os.environ["OMR9_REPO"]
          path = "Hutter_OmegaR/v9/upstream_build_status.json"
          root = pathlib.Path("reports")
          get_text = lambda name: (root / name).read_text().strip() if (root / name).exists() else None
          digest_line = get_text("comp9_sha256.txt")
          summary = {
            "report_type": "source_only_upstream_build",
            "version": "omr9-build-status-v1",
            "run_id": os.environ["OMR9_RUN_ID"],
            "run_url": "https://github.com/" + repo + "/actions/runs/" + os.environ["OMR9_RUN_ID"],
            "job_status_before_reporting": os.environ["OMR9_JOB_STATUS"],
            "completed_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "source": "https://github.com/marwoelk/cmix-neif-2.0",
            "expected_upstream_commit": "35d1957a5074db802fc134126afc77b76d931761",
            "checked_out_commit": get_text("upstream_commit.txt"),
            "comp9_bytes": int(get_text("comp9_bytes.txt")) if get_text("comp9_bytes.txt") else None,
            "comp9_sha256": digest_line.split()[0] if digest_line else None,
            "resource_text": get_text("build_resources.txt"),
            "test_scope": "BUILD_ONLY_NO_ENWIK9_NO_SUBMISSION",
            "hutter_record_claimed": False,
          }
          content = (json.dumps(summary, ensure_ascii=False, indent=2) + "\n").encode()
          uri = "https://api.github.com/repos/" + repo + "/contents/" + path
          token = os.environ["GH_TOKEN"]
          headers = {
            "Authorization": "Bearer " + token,
            "Accept": "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28",
            "User-Agent": "hutter-omega-r-build-reporter",
          }
          try:
            request = urllib.request.Request(uri, headers=headers)
            with urllib.request.urlopen(request, timeout=20) as response:
              current = json.load(response)
            sha = current.get("sha")
          except urllib.error.HTTPError as error:
            if error.code != 404:
              raise
            sha = None
          payload = {
            "message": "Documenter le résultat de compilation cmix-neif-2.0 (sans enwik9)",
            "content": base64.b64encode(content).decode("ascii"),
            "branch": "main",
          }
          if sha:
            payload["sha"] = sha
          request = urllib.request.Request(
            uri, data=json.dumps(payload).encode("utf-8"), headers=headers, method="PUT"
          )
          with urllib.request.urlopen(request, timeout=30) as response:
            response.read()
          print("Build diagnostic published at " + path)
          PY
