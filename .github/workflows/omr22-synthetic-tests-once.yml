name: OMÉGA-R v0.22 — quatre contre-épreuves C++ (une fois)
on:
  push:
    branches:
      - research/omr22-logit-temperature
    paths:
      - .github/workflows/omr22-synthetic-tests-once.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  four-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute three independent deterministic C++ controls
        run: |
          set -euo pipefail
          for kind in biased calibrated heterogeneous replay; do
            g++ -std=c++17 -O2 -Wall -Wextra -Werror -I Hutter_OmegaR/v22 Hutter_OmegaR/v22/test_temperature_$kind.cpp -o /tmp/omr22-test-$kind
            /tmp/omr22-test-$kind > /tmp/omr22-$kind.stdout 2> /tmp/omr22-$kind.stderr
            grep -F 'OMR22_' /tmp/omr22-$kind.stdout
          done
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          d={}
          for kind in ('biased','calibrated','heterogeneous','replay'):
              s=Path('/tmp/omr22-'+kind+'.stderr').read_text()
              report=json.loads(re.search(r'OMR22_TEMPERATURE_RESULT (\{.*\})',s).group(1))
              assert report['train_bits']==262144 and report['coded_bits']==400000
              assert report['real_probabilities_changed'] is False
              d[kind]=report
          assert d['biased']['global_train_choice']!=0
          assert d['calibrated']['global_train_choice']==0
          assert d['calibrated']['position_train_choices']==[0]*8
          assert d['heterogeneous']['position_train_choices']==[6,5,6,5,6,5,6,5]
          assert d['heterogeneous']['position_holdout_gain_bits']>d['heterogeneous']['global_holdout_gain_bits']
          print('OMR22_FOUR_CPP_CONTROLS_VERIFIED; SYNTHETIC_ONLY')
          PY
